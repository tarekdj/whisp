[project]
name = "whisp"
version = "0.1.0"
description = "Local hold-to-talk dictation for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "evdev>=1.7.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.scripts]
whisp = "whisp.daemon:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
